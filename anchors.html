	<!-- Add Anchor Modal -->
	<div class="modal fade" id="addAnchorModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
		<div class="modal-header">
			<h5 class="modal-title">Add Anchor</h5>
			<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		</div>
		<div class="modal-body">

			<div class="mb-2">
			<label>MAC Address</label>
			<input type="text" id="new-anchor-mac" class="form-control" placeholder="AA:BB:CC:DD:EE:FF">
			</div>

			<div class="mb-2">
			<label>Site ID</label>
			<input type="number" id="new-anchor-site-id" class="form-control" placeholder="Site ID">
			</div>

			<div class="mb-2">
			<label>Latitude</label>
			<input type="number" step="any" id="new-anchor-lat" class="form-control" placeholder="0.000000">
			</div>

			<div class="mb-2">
			<label>Longitude</label>
			<input type="number" step="any" id="new-anchor-lon" class="form-control" placeholder="0.000000">
			</div>

			<div class="form-check mt-2">
			<input class="form-check-input" type="checkbox" id="new-anchor-active" checked>
			<label class="form-check-label">Active</label>
			</div>

		</div>
		<div class="modal-footer">
			<button class="btn btn-success" id="create-anchor-btn">Create</button>
		</div>
		</div>
	</div>
	</div>

	<!-- Edit Anchor Modal -->
	<div class="modal fade" id="editAnchorModal" tabindex="-1">
	<div class="modal-dialog">
		<div class="modal-content">
		<div class="modal-header">
			<h5 class="modal-title">Edit Anchor</h5>
			<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
		</div>
		<div class="modal-body">

			<input type="hidden" id="edit-anchor-id">

			<div class="mb-2">
			<label>MAC Address</label>
			<input type="text" id="edit-anchor-mac" class="form-control" placeholder="AA:BB:CC:DD:EE:FF">
			</div>

			<div class="mb-2">
			<label>Site ID</label>
			<input type="number" id="edit-anchor-site-id" class="form-control" placeholder="Site ID">
			</div>

			<div class="mb-2">
			<label>Latitude</label>
			<input type="number" step="any" id="edit-anchor-lat" class="form-control" placeholder="0.000000">
			</div>

			<div class="mb-2">
			<label>Longitude</label>
			<input type="number" step="any" id="edit-anchor-lon" class="form-control" placeholder="0.000000">
			</div>

			<div class="form-check mt-2">
			<input class="form-check-input" type="checkbox" id="edit-anchor-active">
			<label class="form-check-label">Active</label>
			</div>

		</div>
		<div class="modal-footer">
			<button class="btn btn-primary" id="save-anchor-btn">Save</button>
		</div>
