	<style>
			#controls {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
			}

			#device-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
				gap: 10px;
			}

			.device-card {
				border: 2px solid #ccc;
				border-radius: 8px;
				padding: 15px;
				text-align: center;
				background: #f8f9fa;
				font-weight: 600;
				transition: 0.3s;
			}

			.device-card.checked {
				background: #28a745;
				border-color: #28a745;
				color: white;
			}

			.device-card.missing {
				background: #fff3cd;
				border-color: #ffc107;
			}

			.device-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
			gap: 12px;
			}

			.device-btn {
			padding: 16px;
			border-radius: 8px;
			border: 2px solid #ccc;
			background: white;
			cursor: pointer;
			font-weight: 600;
			transition: 0.2s;
			}

			.device-btn:hover {
			background: #f5f5f5;
			}

			.device-btn.checked {
			background: #2ecc71;
			border-color: #2ecc71;
			color: white;
			}
			</style>

</head>
