<style>
/* -------------------------
Layout
------------------------- */

.app-wrapper {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 87%;
}

.app-header {
    height: 64px;
    flex-shrink: 0;
}

.app-footer {
    height: 40px;
    flex-shrink: 0;
    text-align: center;
    line-height: 40px;
}

/* Map container */

.app-content {
    flex: 1;
    position: relative; /* important for overlay controls */
    padding: 0;
}

/* -------------------------
Map
------------------------- */

#map {
    width: 100%;
    height: calc(100vh - 104px); /* header + footer */
}

/* -------------------------
Demo Controls Panel
------------------------- */

#demo-controls {
    position: absolute;
    top: 20px;
    right: 20px;

    width: 260px;

    z-index: 1000;

    background: white;
    border-radius: 10px;

    padding: 14px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.15),
        0 8px 20px rgba(0,0,0,0.15);

    font-family: system-ui, -apple-system, sans-serif;
}

/* rows */

.control-row {
    margin-bottom: 12px;
}

.control-row:last-child {
    margin-bottom: 0;
}

/* labels */

.control-row label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
}

/* datetime */

#startTime {
    width: 100%;
    padding: 5px;
}

/* slider */

#speedSlider {
    width: 100%;
}

#speedLabel {
    font-size: 12px;
    font-weight: 600;
    margin-left: 4px;
}

/* buttons */

#demo-controls button {

    border: none;
    border-radius: 6px;

    padding: 6px 10px;

    background: #3f51b5;
    color: white;

    font-size: 13px;

    cursor: pointer;
}

#demo-controls button:hover {
    background: #2c3ea3;
}

#stopBtn {
    background: #c62828;
}

#stopBtn:hover {
    background: #9a1e1e;
}
</style>
