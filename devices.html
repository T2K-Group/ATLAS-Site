<style>

#devices-container {
  font-family: Inter, system-ui, sans-serif;
}

.org-title {
  margin: 40px 0 12px;
  font-size: 20px;
  font-weight: 600;
  color: #111827;
}

.devices-wrapper {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.device-card {
  display: flex;
  gap: 20px;
  background: #ffffff;
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  border: 1px solid #e5e7eb;
  transition: 0.2s ease;
}

.device-card:hover {
  box-shadow: 0 10px 28px rgba(0,0,0,0.10);
}

.device-map {
  width: 260px;
  min-width: 260px;
  border-radius: 12px;
  overflow: hidden;
}

.device-map img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.device-content {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.device-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.device-name {
  font-size: 18px;
  font-weight: 600;
  color: #111827;
}

.device-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}

.device-info-grid {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px 18px;
  font-size: 14px;
  color: #374151;
}

.device-info-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.device-info-item i {
  width: 16px;
  text-align: center;
  color: #6b7280;
}


</style>
