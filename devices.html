<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-lg">
	  <div class="modal-content">
		<div class="modal-header bg-primary text-white">
		  <h5 class="modal-title" id="deviceName">Device Info</h5>
		  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
		</div>
		<div class="modal-body">
		  <div class="row">
			<!-- Battery Info -->
			<div class="col-md-6 mb-3">
			  <div class="card border-warning">
				<div class="card-header bg-warning text-dark">Battery Info</div>
				<div class="card-body">
				  <ul class="list-unstyled mb-0">
					<li id="battPercent"></li>
					<li id="battVoltage"></li>
					<li id="battTemp"></li>
					<li id="battCurrentDraw"></li>
					<li id="battTTE"></li>
				  </ul>
				</div>
			  </div>
			</div>
  
			<!-- Cell Info -->
			<div class="col-md-6 mb-3">
			  <div class="card border-info">
				<div class="card-header bg-info text-white">Cell Info</div>
				<div class="card-body">
				  <ul class="list-unstyled mb-0">
					<li id="mmc"></li>
					<li id="mnc"></li>
					<li id="tac"></li>
					<li id="band"></li>
					<li id="cellId"></li>
				  </ul>
				</div>
			  </div>
			</div>
		  </div>
  
		  <!-- Location Info -->
		  <div class="row">
			<div class="col-12 mb-3">
			  <div class="card border-success">
				<div class="card-header bg-success text-white">Location</div>
				<div class="card-body">
				  <ul class="list-unstyled mb-0">
					<li id="lat"></li>
					<li id="lon"></li>
					<li id="accuracy"></li>
					<li id="atSite"></li>
					<li id="lastSeen"></li>
				  </ul>
				</div>
			  </div>
			</div>
		  </div>
